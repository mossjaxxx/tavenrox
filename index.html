<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TAVENROX - Packaging Machinery Manufacturer</title>
  <style>
    /* 基础重置与变量 */
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; }
    :root {
      --navy: #0B2A4A;
      --blue: #0066FF;
      --light-bg: #F8FAFC;
      --text-dark: #1E293B;
      --text-gray: #64748B;
      --border-color: #E2E8F0;
    }
    body { color: var(--text-dark); background-color: #ffffff; line-height: 1.5; overflow-x: hidden; }
    a { text-decoration: none; color: inherit; }

    /* 顶部导航栏 */
    header {
      position: sticky; top: 0; background: #fff; border-bottom: 1px solid var(--border-color);
      z-index: 1000; padding: 15px 5%; display: flex; align-items: center; justify-content: space-between;
    }
    .logo-container { display: flex; align-items: center; gap: 12px; }
    .logo-icon { width: 40px; height: 32px; fill: var(--navy); }
    .brand-title { font-size: 24px; font-weight: 900; color: var(--navy); letter-spacing: 1.5px; line-height: 1; }
    .brand-subtitle { font-size: 9px; font-weight: 700; color: var(--navy); letter-spacing: 2px; }

    nav { display: flex; gap: 30px; align-items: center; }
    nav a { font-size: 14px; font-weight: 600; color: #475569; position: relative; padding: 5px 0; }
    nav a.active { color: var(--blue); }
    nav a.active::after {
      content: ''; position: absolute; bottom: 0; left: 0; width: 100%; height: 3px; background: var(--blue); border-radius: 2px;
    }

    .header-actions { display: flex; align-items: center; gap: 20px; }
    .search-btn { background: none; border: none; cursor: pointer; color: #475569; }
    .quote-btn {
      background: var(--blue); color: #fff; border: none; padding: 10px 22px; border-radius: 25px;
      font-weight: 600; font-size: 14px; cursor: pointer; display: flex; align-items: center; gap: 8px;
    }

    /* Hero 首屏区 */
    .hero {
      position: relative; background: linear-gradient(135deg, #F0F6FF 0%, #FFFFFF 60%);
      padding: 60px 5% 80px; display: grid; grid-template-columns: 1fr 1fr; gap: 40px; align-items: center;
    }
    .hero-subtitle { color: var(--blue); font-size: 13px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; margin-bottom: 15px; }
    .hero-title { font-size: 48px; font-weight: 800; color: var(--navy); line-height: 1.15; margin-bottom: 20px; }
    .hero-title span { color: var(--blue); }
    .hero-desc { font-size: 15px; color: var(--text-gray); max-width: 520px; margin-bottom: 30px; line-height: 1.6; }
    .hero-btns { display: flex; gap: 15px; margin-bottom: 40px; }
    .btn-primary { background: var(--blue); color: #fff; padding: 14px 28px; border-radius: 6px; font-weight: 600; font-size: 15px; }
    .btn-secondary { border: 1px solid var(--border-color); background: #fff; color: var(--navy); padding: 14px 28px; border-radius: 6px; font-weight: 600; font-size: 15px; display: flex; align-items: center; gap: 8px; }

    .hero-features { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; }
    .feature-item { display: flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 600; color: var(--navy); }
    .feature-icon { width: 32px; height: 32px; background: #E0F2FE; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: var(--blue); flex-shrink: 0; }

    .hero-image-container { position: relative; text-align: right; }
    .hero-img { width: 100%; max-width: 580px; border-radius: 12px; box-shadow: 0 20px 40px rgba(0,0,0,0.08); }
    .hero-badge {
      position: absolute; bottom: -20px; left: 20px; background: #fff; padding: 15px 25px; border-radius: 8px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.1); border-left: 4px solid var(--blue); text-align: left;
    }
    .hero-badge-title { font-weight: 700; font-size: 14px; color: var(--navy); }
    .hero-badge-sub { font-size: 12px; color: var(--text-gray); }

    /* 侧边悬浮栏 */
    .floating-sidebar {
      position: fixed; right: 0; top: 40%; transform: translateY(-50%); z-index: 999; display: flex; flex-direction: column; gap: 2px;
    }
    .sidebar-item {
      background: var(--blue); color: #fff; padding: 12px 15px; display: flex; flex-direction: column; align-items: center;
      font-size: 11px; font-weight: 600; gap: 4px; border-radius: 8px 0 0 8px; cursor: pointer; transition: 0.3s;
    }
    .sidebar-item.whatsapp { background: #10B981; }
    .sidebar-item.email { background: var(--navy); }
    .sidebar-item:hover { padding-left: 20px; }

    /* 产品展示区 */
    .products-section { padding: 80px 5%; background: #fff; }
    .section-header { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 40px; }
    .section-tag { color: var(--blue); font-size: 13px; font-weight: 700; text-transform: uppercase; margin-bottom: 8px; }
    .section-title { font-size: 32px; font-weight: 800; color: var(--navy); }
    .view-all { color: var(--blue); font-weight: 600; font-size: 14px; }

    .product-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 25px; }
    .product-card {
      background: var(--light-bg); border-radius: 12px; border: 1px solid var(--border-color); padding: 25px;
      transition: 0.3s; display: flex; flex-direction: column; justify-content: space-between;
    }
    .product-card:hover { transform: translateY(-5px); box-shadow: 0 15px 30px rgba(0,0,0,0.08); }
    .product-img { width: 100%; height: 180px; object-fit: contain; margin-bottom: 20px; }
    .product-icon { width: 40px; height: 40px; background: var(--blue); border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #fff; margin-bottom: 15px; }
    .product-title { font-size: 18px; font-weight: 700; color: var(--navy); margin-bottom: 10px; }
    .product-desc { font-size: 13px; color: var(--text-gray); margin-bottom: 20px; line-height: 1.5; }
    .product-link { color: var(--blue); font-weight: 700; font-size: 18px; }

    /* OEM/ODM 服务区 */
    .oem-section {
      background: var(--navy); color: #fff; display: grid; grid-template-columns: 1fr 1fr; clip-path: polygon(0 0, 100% 0, 100% 100%, 0 100%);
    }
    .oem-content { padding: 80px 8% 80px 10%; }
    .oem-tag { color: #38BDF8; font-size: 13px; font-weight: 700; text-transform: uppercase; margin-bottom: 10px; }
    .oem-title { font-size: 36px; font-weight: 800; margin-bottom: 20px; line-height: 1.2; }
    .oem-desc { font-size: 14px; color: #94A3B8; margin-bottom: 30px; line-height: 1.6; }
    .oem-btn { display: inline-block; border: 1px solid #ffffff40; color: #fff; padding: 12px 28px; border-radius: 25px; font-weight: 600; margin-bottom: 40px; }
    .oem-features { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
    .oem-feature-item { display: flex; align-items: center; gap: 12px; font-size: 13px; font-weight: 600; }
    .oem-icon-box { width: 36px; height: 36px; background: #0066FF20; border-radius: 8px; display: flex; align-items: center; justify-content: center; color: var(--blue); }

    .oem-image-side { position: relative; background-size: cover; background-position: center; min-height: 400px; }
    .factory-overlay {
      position: absolute; bottom: 40px; left: 40px; right: 40px; background: rgba(11, 42, 74, 0.85);
      backdrop-filter: blur(8px); padding: 25px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.1);
      display: flex; justify-content: space-between; align-items: center;
    }

    /* 联系我们区 */
    .contact-section { padding: 80px 5%; background: var(--light-bg); display: grid; grid-template-columns: 1fr 1fr; gap: 50px; align-items: center; }
    .contact-title { font-size: 36px; font-weight: 800; color: var(--navy); margin-bottom: 15px; }
    .contact-desc { font-size: 14px; color: var(--text-gray); margin-bottom: 30px; }
    .contact-info-card
