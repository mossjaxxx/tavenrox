  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; scroll-behavior: smooth; }
    :root {
      --navy: #0B2A4A;
      --blue: #0066FF;
      --light-blue: #F0F6FF;
      --light-bg: #F8FAFC;
      --text-dark: #1E293B;
      --text-gray: #64748B;
      --border-color: #E2E8F0;
    }
    body { color: var(--text-dark); background-color: #ffffff; line-height: 1.5; overflow-x: hidden; }
    a { text-decoration: none; color: inherit; }

    header {
      position: sticky; top: 0; background: #fff; border-bottom: 1px solid var(--border-color);
      z-index: 1000; padding: 15px 5%; display: flex; align-items: center; justify-content: space-between;
    }
    .logo-container { display: flex; align-items: center; gap: 12px; }
    .logo-icon { width: 40px; height: 32px; fill: var(--navy); }
    .brand-title { font-size: 24px; font-weight: 900; color: var(--navy); letter-spacing: 1.5px; line-height: 1; }
    .brand-subtitle { font-size: 9px; font-weight: 700; color: var(--navy); letter-spacing: 2px; }

    nav { display: flex; gap: 30px; align-items: center; }
    nav a { font-size: 14px; font-weight: 600; color: #475569; position: relative; padding: 5px 0; transition: 0.3s; }
    nav a:hover, nav a.active { color: var(--blue); }
    nav a.active::after {
      content: ''; position: absolute; bottom: 0; left: 0; width: 100%; height: 3px; background: var(--blue); border-radius: 2px;
    }

    .header-actions { display: flex; align-items: center; gap: 20px; }
    .search-btn { background: none; border: none; cursor: pointer; color: #475569; font-size: 16px; }
    .quote-btn {
      background: var(--blue); color: #fff; border: none; padding: 10px 22px; border-radius: 25px;
      font-weight: 600; font-size: 14px; cursor: pointer; display: flex; align-items: center; gap: 8px;
      transition: 0.3s;
    }
    .quote-btn:hover { background: #0052cc; }

    .floating-sidebar {
      position: fixed; right: 0; top: 40%; transform: translateY(-50%); z-index: 999; display: flex; flex-direction: column; gap: 2px;
    }
